# =====================================================================
# gnidart-trading-bot — configuration
# تمام تصمیمات طراحی اینجا متمرکز است. هیچ عدد جادویی داخل کد نیست.
# =====================================================================

project: gnidart-trading-bot
mode: backtest            # backtest | paper | mt5-demo | mt5-live

trading:
  symbols: [XAUUSD]       # طلا — انتخاب کاربر؛ بعد از اثبات → گسترش
  decision_timeframe: M15 # تایم‌فریم تصمیم (انتخاب منتور)
  trend_timeframe: H1     # صفحه ۱ Triple Screen — جهت روند
  entry_timeframe: M5     # پالایش ورود (فاز ۲ به بعد)
  trade_sessions: [london, newyork]   # فقط سشن‌های نقدینگی‌دار
  sessions_utc:
    asia:   [0, 8]
    london: [7, 16]
    newyork: [12, 21]
  max_trades_per_day: 3
  max_open_positions: 1
  max_spread_usd: 0.40   # گیت اسپرد طلا: بالای ۴۰ سنت معامله ممنوع (درس v0)

risk:
  risk_per_trade: 0.005   # ۰.۵٪ سرمایه در هر معامله (فاز دمو؛ با اثبات لبه → 0.01)
  max_daily_loss: 0.03    # ۳٪ روزانه → توقف تا فردا
  max_monthly_loss: 0.06  # ۶٪ ماهانه → توقف کامل (قانون الدر)

breaker:                  # نردبان برق‌گیر ضرر — قلب خودتنظیمی ربات
  # فاز ۳ (بک‌تست ۳ساله، سناریو G4): نردبان ۳/۴/۵/۶ در برابر ۲/۳/۴/۶
  # دُم افت سرمایه را از P(DD<−۱۵٪)=۳۶٪ به ~۱۱٪ فشرده کرد بی‌آنکه
  # انتظار ریاضی (0.159R) بخورد — چون با نرخ‌برد ~۳۳٪، رشتهٔ ۲-باختی
  # «عادی» است نه هشدار. انتخاب نهایی را دموی فوروارد تأیید می‌کند.
  derate_at: 3            # ضرر متوالی ۳ → حجم ×۰.۵
  deep_derate_at: 4       # ضرر متوالی ۴ → حجم ×۰.۲۵ + فقط ستاپ A
  pause_at: 5             # ضرر متوالی ۵ → توقف ۲۴ ساعته + پست‌مورتم
  halt_at: 6              # ضرر متوالی ۶ → توقف کامل تا acknowledge
  pause_hours: 24

data:
  source: dukascopy       # فاز ۰-ب
  cache_dir: data/cache

journal:
  path: data/journal.db   # SQLite — حافظه بلندمدت ربات (مشترک بین آستین‌ها؛ ستون symbol جدا می‌کند)

live:                     # فاز ۵ — دموی فوروارد
  direction_filter: long  # شواهد فاز ۴: فروش‌ها ۳ سال خالص‌زیان‌ده (−$1.5k)؛
                          # پست‌مورتم ماهانه جهت را زیر نظر دارد
  utc_offset: auto        # auto = قاعدهٔ EET/EEST (زمستان +۲، تابستان +۳)
  history_bars: 800       # گرم‌شدن اندیکاتورهای رژیم
  poll_seconds: 20
  magic: 954001

symbol_profiles:            # فاز ۷ — پارامترهای وابسته به نماد (همهٔ مقادیر دلاری)
  XAUUSD:                   # = رفتار فاز ۵؛ آستین زندهٔ دمو دست نمی‌خورد
    contract_size: 100.0    # ۱ لات = ۱۰۰ اونس
    sl_pad: 0.50            # بافر استاپ دلاری (فاز ۳ walk-forward)
    max_spread_usd: 0.40    # درس v0: بالای ۴۰ سنت ممنوع
    max_lots: 0.10
    min_lot_policy: force   # رفتار فعلی طلا — تغییر نمی‌کند
    digits: 2
    baseline_wr: 0.348      # walk-forward طلا
    direction: long
  XAGUSD:                   # فاز ۷ first-look: PF 1.21 @ اسپرد $0.04، 7.0 معامله/ماه
    contract_size: 5000.0   # ۱ لات = ۵۰۰۰ اونس
    sl_pad: 0.01093         # 0.50 × k=0.02186 (نسبت ATR نقره/طلا) — بدون re-tuning
    max_spread_usd: 0.06    # موقت: ~۳× اسپرد اندازه‌گیری‌شدهٔ دمو ($0.018)؛ با تاریخچهٔ MT5 نهایی می‌شود
    max_lots: 0.05
    min_lot_policy: skip    # اگر حجم محاسبه‌شده < ۰.۰۱ لات → معامله نکن (ریسک > بودجه)
    digits: 3
    baseline_wr: 0.308      # first-look نقره
    direction: long
